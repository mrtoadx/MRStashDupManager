name: MRStashDupManager
description: Detects duplicate scenes via Stash's perceptual-hash matching and presents a modern side-by-side review UI to keep the best copy and delete or remove the rest.
version: 1.0.0
exec:
  - python3
  - "{pluginDir}/MRStashDupManager.py"
interface: raw
tasks:
  - name: Scan for Duplicates
    description: Finds duplicate scenes by phash and writes a review report for the UI. Run 'Generate Phashes' first if you haven't.
    defaultArgs:
      mode: Scan for Duplicates
  - name: Tag Duplicates
    description: Applies the _DuplicateMarkForDeletion tag to the lower-quality copy in each duplicate group, for review in Stash's normal library UI.
    defaultArgs:
      mode: Tag Duplicates
ui:
  javascript:
    - MRStashDupManager.js
  css:
    - MRStashDupManager.css
  assets:
    /: assets/
settings:
  matchDistance:
    displayName: Match Distance
    description: >
      Perceptual-hash hamming distance. 0 = exact match (safest). Higher values
      (1-10) catch more near-duplicates but risk false positives. Default 0.
    type: NUMBER
  durationDiff:
    displayName: Max Duration Difference (seconds)
    description: >
      Only treat scenes as duplicates when their durations are within this many
      seconds of each other. Set to -1 to disable duration checking. Default 1.
    type: NUMBER
  whitelist:
    displayName: Whitelist Paths (never delete)
    description: >
      Comma-separated paths that should always be kept. Scenes in these paths are
      preferred as the copy to keep. E.g. /media/Favorites,/mnt/keep
    type: STRING
  graylist:
    displayName: Gray-list Paths (secondary)
    description: >
      Comma-separated preferential paths used to break ties when choosing which
      copy to keep. Ranked below whitelist, above blacklist.
    type: STRING
  blacklist:
    displayName: Blacklist Paths (delete first)
    description: >
      Comma-separated least-preferred paths. Scenes in these paths are the first
      candidates for deletion. E.g. /media/Downloads,/mnt/temp
    type: STRING
